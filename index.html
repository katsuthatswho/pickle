<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pickleball Session</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#fff}button,input,textarea,select{font:inherit}.app{max-width:720px;margin:auto;padding:22px 16px 90px}header{display:flex;justify-content:space-between;align-items:start;margin-bottom:28px}h1{margin:2px 0;font-size:30px}h2{font-size:19px;margin:0 0 12px}.muted{color:#707070;font-size:14px}.panel{display:none}.panel.on{display:block}.section{margin-bottom:28px}.row{display:flex;gap:8px}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;background:#fff}.btn{padding:12px 15px;border:1px solid #111;border-radius:10px;background:#111;color:#fff;font-weight:700}.secondary{background:#fff;color:#111;border-color:#ddd}.link{border:0;background:none;text-decoration:underline;padding:5px}.list{border-top:1px solid #ddd;margin-top:12px}.player{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #ddd}.name{flex:1;font-weight:650}.square{width:42px;height:42px;border:1px solid #ddd;border-radius:10px;background:#fff;font-size:22px}.count{width:32px;text-align:center;font-size:20px;font-weight:800}.toolbar{display:flex;justify-content:space-between;margin:12px 0}.seg{display:flex;border:1px solid #ddd;border-radius:10px;padding:3px}.seg button{border:0;background:#fff;padding:7px 10px;border-radius:7px}.seg .on{background:#111;color:#fff}.group{margin:20px 0}.grouphead{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:6px;font-weight:800}.chips{display:flex;gap:7px;flex-wrap:wrap;padding-top:9px}.chip{border:1px solid #ddd;border-radius:999px;padding:7px 10px}.matchbox{border:1px solid #ddd;border-radius:12px;padding:13px}.team{display:grid;grid-template-columns:1fr 1fr 65px;gap:7px;margin:7px 0}.match{padding:11px 0;border-bottom:1px solid #ddd;display:flex;gap:8px}.match span{flex:1}.copy{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd;padding:7px 5px 10px}.nav button{border:0;background:#fff;color:#777;padding:6px}.nav .on{color:#111;font-weight:800}.nav b{display:block;font-size:17px}.empty{color:#777;padding:18px 0}.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;border-radius:999px;display:none}dialog{border:0;border-radius:14px;width:min(600px,92%);padding:18px}dialog::backdrop{background:#0005}.hist{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ddd}@media(min-width:650px){.nav{width:520px;left:50%;transform:translateX(-50%);border:1px solid #ddd;border-bottom:0;border-radius:14px 14px 0 0}}
</style></head><body><div class="app"><header><div><div class="muted">PICKLEBALL</div><h1>Session</h1><div id="meta" class="muted"></div></div><button class="link" id="history">History</button></header>
<section class="panel on" id="checkin"><div class="section"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Check in</h2><button class="link" id="clearCheckin" style="display:none">Clear check-in</button></div><div class="row"><input class="input" id="name" placeholder="Player name"><button class="btn" id="add">Add</button></div></div><div class="section"><h2>Import players</h2><div class="row"><select class="input" id="import"><option value="">Choose a saved session</option></select><button class="btn secondary" id="doImport">Import</button></div></div><div class="section"><h2>Paste a list</h2><textarea class="input" id="paste" rows="7" placeholder="Sarah&#10;Alex&#10;Jess&#10;Tom"></textarea><br><br><button class="btn secondary" id="addList">Add players</button></div><div class="section"><b><span id="n">0</span> players checked in</b><div class="list" id="checkList"></div></div></section>
<section class="panel" id="wins"><div class="section"><h2>Win tally</h2><div class="toolbar"><div class="seg"><button class="on" id="az">A–Z</button><button id="bywins">Wins</button></div><button class="btn secondary" id="undo">Undo</button></div><input class="input" id="search" placeholder="Find player"><div class="list" id="winList"></div></div><button class="btn" id="groups">Group by wins</button><div id="groupList"></div></section>
<section class="panel" id="matches"><div class="section"><h2>Match log</h2><div class="muted">Optional. Saving a match adds a win to both winners.</div><br><div class="matchbox"><b>Team 1</b><div class="team"><select class="input p" id="a"></select><select class="input p" id="b"></select><input class="input" id="s1" inputmode="numeric" placeholder="11"></div><b>Team 2</b><div class="team"><select class="input p" id="c"></select><select class="input p" id="d"></select><input class="input" id="s2" inputmode="numeric" placeholder="7"></div><button class="btn" style="width:100%" id="saveMatch">Save match</button></div><div id="matchList"></div></div></section>
<section class="panel" id="checkout"><div class="section"><h2>Checkout</h2><b id="summary"></b></div><div class="section"><h2>Copy as Markdown</h2><div class="copy"><button class="btn secondary cp" data-x="att">Attendees</button><button class="btn secondary cp" data-x="wins">Win tally</button><button class="btn secondary cp" data-x="matches">Match log</button><button class="btn cp" data-x="all">Copy all</button></div></div><div class="section"><h2>Save</h2><div class="row"><button class="btn" id="save">Save</button><button class="btn secondary" id="csv">Export CSV</button></div></div><button class="link" id="new">Start new session</button></section></div>
<nav class="nav"><button class="on" data-tab="checkin"><b>1</b>Check in</button><button data-tab="wins"><b>2</b>Wins</button><button data-tab="matches"><b>3</b>Matches</button><button data-tab="checkout"><b>4</b>Checkout</button></nav><div class="toast" id="toast"></div><dialog id="dlg"><h2>History</h2><div id="hist"></div><br><button class="btn secondary" onclick="dlg.close()">Close</button></dialog>
<script>
const K='pb-current-v2',H='pb-history-v2';const fresh=()=>({id:crypto.randomUUID(),date:new Date().toISOString(),players:[],matches:[],actions:[]});let S=JSON.parse(localStorage.getItem(K)||'null')||fresh(),sort='az',showGroups=false;const $=x=>document.getElementById(x),saveLocal=()=>{localStorage.setItem(K,JSON.stringify(S));render()},fmt=d=>new Date(d).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'}),toast=t=>{let e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1500)},pn=id=>S.players.find(p=>p.id===id)?.name||'Unknown',esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function cleanName(x){return x.replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g,'').replace(/^\s*\d+\s*[.)\-:]\s*/,'').replace(/^\s*[-•*]+\s*/,'').replace(/^\s*[@~]+\s*/,'').replace(/\s+/g,' ').trim()}
function addNames(names){let cleaned=names.map(cleanName).filter(Boolean),counts={};cleaned.forEach(n=>counts[n.toLowerCase()]=(counts[n.toLowerCase()]||0)+1);let added=0;cleaned.forEach(raw=>{let key=raw.toLowerCase(),existing=S.players.filter(p=>p.name.toLowerCase()===key||p.name.toLowerCase().startsWith(key+' '));if(counts[key]>1||existing.length){let exact=S.players.find(p=>p.name.toLowerCase()===key);if(exact)exact.name=raw+' 1';let nums=S.players.filter(p=>p.name.toLowerCase().startsWith(key+' ')).map(p=>{let n=parseInt(p.name.slice(raw.length+1),10);return Number.isFinite(n)?n:0});let next=Math.max(0,...nums)+1;S.players.push({id:crypto.randomUUID(),name:raw+' '+next,wins:0})}else S.players.push({id:crypto.randomUUID(),name:raw,wins:0});added++});S.players.sort((a,b)=>a.name.localeCompare(b.name));saveLocal();toast(added+' added')}
function removeP(id){let p=S.players.find(x=>x.id===id);if(confirm('Remove '+p.name+'?')){S.players=S.players.filter(x=>x.id!==id);S.matches=S.matches.filter(m=>![...m.t1,...m.t2].includes(id));saveLocal()}}
function rename(id){let p=S.players.find(x=>x.id===id),v=prompt('Player name',p.name);if(v?.trim()){p.name=v.trim();saveLocal()}}
function win(id,n){let p=S.players.find(x=>x.id===id);if(!p)return;let before=p.wins;p.wins=Math.max(0,p.wins+n);S.actions.push({id,before,after:p.wins});saveLocal()}
function undo(){let a=S.actions.pop();if(!a)return toast('Nothing to undo');let p=S.players.find(x=>x.id===a.id);if(p)p.wins=a.before;saveLocal()}
function history(){return JSON.parse(localStorage.getItem(H)||'[]')}
function renderImport(){let h=history();$('import').innerHTML='<option value="">Choose a saved session</option>'+h.map(s=>'<option value="'+s.id+'">'+fmt(s.date)+' · '+s.players.length+' players</option>').join('')}
function render(){ $('clearCheckin').style.display=S.players.length?'inline-block':'none';$('meta').textContent=fmt(S.date)+' · '+S.players.length+' players';$('n').textContent=S.players.length;renderImport();let ps=[...S.players].sort((a,b)=>a.name.localeCompare(b.name));$('checkList').innerHTML=ps.length?ps.map(p=>'<div class="player"><button class="link name" onclick="rename(\''+p.id+'\')">'+esc(p.name)+'</button><button class="link" onclick="removeP(\''+p.id+'\')">×</button></div>').join(''):'<div class="empty">No players yet.</div>';let q=$('search').value.toLowerCase(),wp=[...S.players].filter(p=>p.name.toLowerCase().includes(q));wp.sort(sort==='wins'?(a,b)=>b.wins-a.wins||a.name.localeCompare(b.name):(a,b)=>a.name.localeCompare(b.name));$('winList').innerHTML=wp.length?wp.map(p=>'<div class="player"><span class="name">'+esc(p.name)+'</span><button class="square" onclick="win(\''+p.id+'\',-1)">−</button><span class="count">'+p.wins+'</span><button class="square" onclick="win(\''+p.id+'\',1)">+</button></div>').join(''):'<div class="empty">No players.</div>';$('az').classList.toggle('on',sort==='az');$('bywins').classList.toggle('on',sort==='wins');let opts='<option value="">Player</option>'+ps.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');document.querySelectorAll('.p').forEach(e=>{let v=e.value;e.innerHTML=opts;e.value=v});$('matchList').innerHTML=S.matches.length?S.matches.slice().reverse().map(m=>'<div class="match"><span><b>'+esc(pn(m.t1[0]))+' + '+esc(pn(m.t1[1]))+'</b> '+m.s1+'–'+m.s2+' '+esc(pn(m.t2[0]))+' + '+esc(pn(m.t2[1]))+'</span><button class="link" onclick="delMatch(\''+m.id+'\')">Delete</button></div>').join(''):'<div class="empty">No matches recorded.</div>';renderGroups();$('summary').textContent=S.players.length+' players · '+S.players.reduce((a,p)=>a+p.wins,0)+' wins · '+S.matches.length+' matches'}
function renderGroups(){if(!showGroups)return $('groupList').innerHTML='';let m={};S.players.forEach(p=>(m[p.wins]??=[]).push(p));$('groupList').innerHTML=Object.keys(m).sort((a,b)=>b-a).map(w=>'<div class="group"><div class="grouphead"><span>'+w+' win'+(w==1?'':'s')+'</span><span>'+m[w].length+'</span></div><div class="chips">'+m[w].sort((a,b)=>a.name.localeCompare(b.name)).map(p=>'<span class="chip">'+esc(p.name)+'</span>').join('')+'</div></div>').join('')}
function match(){let ids=['a','b','c','d'].map(x=>$(x).value),s1=+$('s1').value,s2=+$('s2').value;if(ids.some(x=>!x)||new Set(ids).size<4)return toast('Choose four players');if(!Number.isFinite(s1)||!Number.isFinite(s2)||s1===s2)return toast('Check the score');let winners=s1>s2?ids.slice(0,2):ids.slice(2);winners.forEach(id=>S.players.find(p=>p.id===id).wins++);S.matches.push({id:crypto.randomUUID(),t1:ids.slice(0,2),t2:ids.slice(2),s1,s2,winners});['a','b','c','d','s1','s2'].forEach(x=>$(x).value='');saveLocal();toast('Match saved')}
function delMatch(id){let m=S.matches.find(x=>x.id===id);if(!m||!confirm('Delete this match?'))return;m.winners.forEach(id=>{let p=S.players.find(x=>x.id===id);if(p)p.wins=Math.max(0,p.wins-1)});S.matches=S.matches.filter(x=>x.id!==id);saveLocal()}
function md(type){let ps=[...S.players].sort((a,b)=>a.name.localeCompare(b.name)),ws=[...S.players].sort((a,b)=>b.wins-a.wins||a.name.localeCompare(b.name)),att='## Attendees\n\n'+(ps.map(p=>'- '+p.name).join('\n')||'- None'),wins='## Win tally\n\n'+(ws.map(p=>'- '+p.name+': '+p.wins+' win'+(p.wins===1?'':'s')).join('\n')||'- None'),matches='## Match log\n\n'+(S.matches.map(m=>'- '+pn(m.t1[0])+' + '+pn(m.t1[1])+' **'+m.s1+'–'+m.s2+'** '+pn(m.t2[0])+' + '+pn(m.t2[1])).join('\n')||'- None');if(type==='att')return att;if(type==='wins')return wins;if(type==='matches')return matches;return '# Pickleball session · '+fmt(S.date)+'\n\n'+att+'\n\n'+wins+'\n\n'+matches}
async function copy(type){try{await navigator.clipboard.writeText(md(type));toast('Markdown copied')}catch{toast('Copy blocked by browser')}}
function saveSession(){let h=history(),snap=JSON.parse(JSON.stringify(S)),i=h.findIndex(x=>x.id===S.id);if(i>=0)h[i]=snap;else h.unshift(snap);localStorage.setItem(H,JSON.stringify(h));render();toast('Saved')}
function csv(){let cell=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},r=[['date','type','player','wins','team_1','team_2','score']];S.players.forEach(p=>r.push([S.date.slice(0,10),'player',p.name,p.wins,'','','']));S.matches.forEach(m=>r.push([S.date.slice(0,10),'match','','',pn(m.t1[0])+' + '+pn(m.t1[1]),pn(m.t2[0])+' + '+pn(m.t2[1]),m.s1+'-'+m.s2]));let b=new Blob([r.map(x=>x.map(cell).join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pickleball-'+S.date.slice(0,10)+'.csv';a.click()}
function showHist(){let h=history();$('hist').innerHTML=h.length?h.map(s=>'<div class="hist"><span><b>'+fmt(s.date)+'</b><br><span class="muted">'+s.players.length+' players</span></span><button class="btn secondary" onclick="openHist(\''+s.id+'\')">Open</button></div>').join(''):'<div class="empty">No saved sessions.</div>';$('dlg').showModal()}
function openHist(id){let s=history().find(x=>x.id===id);if(s&&confirm('Open this saved session?')){S=JSON.parse(JSON.stringify(s));saveLocal();$('dlg').close()}}
function clearCheckin(){if(!S.players.length)return toast('No players to clear');if(!confirm('Clear everyone from check-in? Wins and matches will not be reset.'))return;S.players=[];saveLocal();toast('Check-in cleared')}
function newSession(){if(!confirm('Start a new session? Check-in, wins and matches will be cleared. Saved sessions stay in History.'))return;S=fresh();sort='az';showGroups=false;$('search').value='';$('paste').value='';$('name').value='';localStorage.setItem(K,JSON.stringify(S));render();tab('checkin');toast('New session')}
function tab(id){document.querySelectorAll('.panel').forEach(e=>e.classList.toggle('on',e.id===id));document.querySelectorAll('.nav button').forEach(e=>e.classList.toggle('on',e.dataset.tab===id));window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(e=>e.onclick=()=>tab(e.dataset.tab));$('add').onclick=()=>{addNames([$('name').value]);$('name').value='';$('name').focus()};$('name').onkeydown=e=>{if(e.key==='Enter')$('add').click()};$('addList').onclick=()=>{addNames($('paste').value.split(/\r?\n/));$('paste').value=''};$('doImport').onclick=()=>{let s=history().find(x=>x.id===$('import').value);if(!s)return toast('Choose a session');addNames(s.players.map(p=>p.name));toast('Players imported')};$('az').onclick=()=>{sort='az';render()};$('bywins').onclick=()=>{sort='wins';render()};$('search').oninput=render;$('undo').onclick=undo;$('groups').onclick=()=>{showGroups=!showGroups;$('groups').textContent=showGroups?'Hide groups':'Group by wins';renderGroups()};$('saveMatch').onclick=match;document.querySelectorAll('.cp').forEach(e=>e.onclick=()=>copy(e.dataset.x));$('save').onclick=saveSession;$('csv').onclick=csv;$('clearCheckin').onclick=clearCheckin;$('new').onclick=newSession;$('history').onclick=showHist;render();
</script></body></html>
